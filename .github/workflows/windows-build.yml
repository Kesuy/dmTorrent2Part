name: Windows EXE

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Validate release notes
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          python scripts/extract_release_notes.py CHANGELOG.md "v$version" release-notes.md
          Get-Content release-notes.md

      - name: Prepare original icon
        run: python -c "from dmtorrent2part.icons import write_ico; write_ico('dmTorrent2Part.ico')"

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon dmTorrent2Part.ico --name dmTorrent2Part dmTorrent2Part.py

      - uses: actions/upload-artifact@v4
        with:
          name: dmTorrent2Part-windows
          path: dist/dmTorrent2Part.exe

      - name: Publish versioned Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = "v$version"
          python scripts/extract_release_notes.py CHANGELOG.md $tag release-notes.md

          $releaseExists = $false
          $legacyRelease = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json body | Out-File -Encoding utf8 release.json
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
            $body = (Get-Content release.json -Raw | ConvertFrom-Json).body
            if ($body -match '^\*\*Full Changelog\*\*:') {
              $legacyRelease = $true
              Write-Host "Legacy/empty release notes detected for $tag; republishing once."
            } else {
              Write-Host "Managed release $tag already exists; skipping publication."
              exit 0
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

          if ($releaseExists -and $legacyRelease) {
            gh release upload $tag dist/dmTorrent2Part.exe --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "dmTorrent2Part $tag" `
              --notes-file release-notes.md
          } else {
            gh release create $tag dist/dmTorrent2Part.exe `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "dmTorrent2Part $tag" `
              --notes-file release-notes.md
          }
