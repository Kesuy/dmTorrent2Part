name: Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name dmTorrent2Part dmTorrent2Part.py
      - uses: actions/upload-artifact@v4
        with:
          name: dmTorrent2Part-windows
          path: dist/dmTorrent2Part.exe
