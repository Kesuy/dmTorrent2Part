name: Windows EXE

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Prepare original icon
        run: python -c "from dmtorrent2part.icons import write_ico; write_ico('dmTorrent2Part.ico')"
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon dmTorrent2Part.ico --name dmTorrent2Part dmTorrent2Part.py
      - uses: actions/upload-artifact@v4
        with:
          name: dmTorrent2Part-windows
          path: dist/dmTorrent2Part.exe
      - name: Publish versioned Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = "v$version"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }

          gh release create $tag dist/dmTorrent2Part.exe `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "dmTorrent2Part $tag" `
            --generate-notes
